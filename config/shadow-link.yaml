name: demo-shadow-link

# Source cluster connection
client_options:
  bootstrap_servers:
  - redpanda-source:9092

# Topic replication settings
topic_metadata_sync_options:
  interval: 10s
  auto_create_shadow_topic_filters:
  - pattern_type: PREFIX
    filter_type: INCLUDE
    name: demo-
  synced_shadow_topic_properties:
  - retention.ms
  - segment.ms
  start_at_earliest: {}

# Consumer group offset replication
consumer_offset_sync_options:
  interval: 10s
  group_filters:
  - pattern_type: LITERAL
    filter_type: INCLUDE
    name: '*'

# ACL replication (optional).
# access_filter.principal has NO wildcard/match-any support - it's a literal
# PrincipalType:name string. A bare '*' is rejected outright at the broker
# ("Invalid principal name") and silently kills this task every interval
# (visible only in broker logs, not in `rpk shadow status`). And
# resource_filter.pattern_type must match the ACL's OWN pattern type exactly -
# a PREFIXED filter will not pick up a LITERAL-pattern ACL just because its
# name happens to start with the prefix. See docs/findings.md Result 7.
# One acl_filters entry only ever matches ONE literal principal - add more
# entries for more principals.
security_sync_options:
  interval: 30s
  acl_filters:
  - resource_filter:
      resource_type: TOPIC
      pattern_type: PREFIXED
      name: demo-
    access_filter:
      principal: 'User:demo-service-account'
      operation: ANY
      permission_type: ALLOW
      host: '*'

# Schema registry replication
schema_registry_sync_options:
  shadow_schema_registry_topic: {}
